name: 가계부 알림 앱 빌드

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK 빌드
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk budget-noti.apk

      - uses: actions/upload-artifact@v4
        with:
          name: budget-noti-apk
          path: budget-noti.apk

      # main 에 올라가면 고정된 다운로드 주소로 공개:
      # https://github.com/<저장소>/releases/download/noti-app/budget-noti.apk
      - name: 다운로드 링크(릴리스) 갱신
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete noti-app --yes --cleanup-tag || true
          gh release create noti-app budget-noti.apk \
            --title "가계부 알림 앱 (빌드 ${{ github.run_number }})" \
            --notes "카카오뱅크 등 은행 앱 알림을 가계부(구글 시트)로 보내는 안드로이드 앱입니다. 휴대폰에서 budget-noti.apk 를 받아 설치하세요." \
            --latest
